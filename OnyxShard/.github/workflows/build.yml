name: Build OnyxShard
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compiler
        run: mvn -B clean package
        working-directory: OnyxShard
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxShard-jar
          path: OnyxShard/target/OnyxShard-*.jar
